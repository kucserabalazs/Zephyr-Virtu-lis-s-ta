<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zephyr Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zephyr Admin">
<link rel="icon" href="../Zephyr%20Apartman%20Kell%C3%A9kek/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../Zephyr%20Apartman%20Kell%C3%A9kek/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../Zephyr%20Apartman%20Kell%C3%A9kek/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --sea: #0b2f5e; --sea-2: #071d38; --sea-3: #12407a; --sky: #2a86ad;
  --gold: #c9a25a; --gold-2: #ffd978; --gold-d: #8a6630;
  --red: #e2483d; --green: #2f9e63; --orange: #e8890c; --blue: #2f6fd6;
  --bg: #f4f1ea; --card: #ffffff; --ink: #14202a; --mut: #5d6b78; --line: #e4ded1; --soft: #faf8f2;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r: 16px; --sh: 0 1px 2px rgba(20,32,42,.06), 0 6px 18px rgba(20,32,42,.07);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; min-height: 100dvh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--sea-3); }
svg.i { width: 20px; height: 20px; flex: none; }
[hidden] { display: none !important; }

/* ---------- belépés ---------- */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 18px; background: radial-gradient(80% 60% at 50% 30%, #fff 0%, #faf6ec 50%, #ece3cf 100%); }
.login-card { width: min(400px, 100%); background: #fff; border-radius: 22px; box-shadow: 0 20px 60px rgba(11,47,94,.16); padding: 30px 24px 24px; text-align: center; }
.login-card img { width: min(260px, 70%); height: auto; }
.login-card h1 { font: 800 15px/1 var(--display); letter-spacing: .4em; text-transform: uppercase; color: var(--gold-d); margin: 14px 0 22px; padding-left: .4em; }
.login-card form { display: grid; gap: 12px; text-align: left; }
.login-note { font-size: 12.5px; color: var(--mut); margin-top: 14px; }

/* ---------- keret ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; align-content: start; }
.top { position: sticky; top: 0; z-index: 30; background: var(--sea); color: #fff; padding: calc(10px + var(--safe-t)) 14px 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 18px rgba(7,29,56,.25); }
.top img { height: 30px; width: auto; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 6px rgba(255,255,255,.5)); }
.top .tt { display: grid; line-height: 1.1; }
.top .tt b { font: 800 18px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.top .tt span { font-size: 11.5px; opacity: .75; }
.top .sp { flex: 1; }
.icon-btn { all: unset; box-sizing: border-box; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.top .icon-btn { background: rgba(255,255,255,.1); }
.top .icon-btn:active { background: rgba(255,255,255,.22); }
.dot { position: absolute; top: 6px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font: 800 10.5px/17px var(--body); text-align: center; box-shadow: 0 0 0 2px var(--sea); }
.demo-pill { font: 800 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--gold-2); color: var(--sea); padding: 5px 8px; border-radius: 99px; }
main { padding: 14px 14px calc(96px + var(--safe-b)); max-width: 1100px; width: 100%; margin: 0 auto; min-width: 0; }
.app > * { min-width: 0; }
.sysw summary { list-style: none; cursor: pointer; } .sysw summary::-webkit-details-marker { display: none; }

/* alsó navigáció (telefon) / oldalsáv (asztal) */
.nav { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + var(--safe-b)); }
.nav button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 12px; color: var(--mut); font: 700 11px/1 var(--body); position: relative; }
.nav button svg { width: 23px; height: 23px; }
.nav button.on { color: var(--sea); }
.nav button.on::before { content: ""; position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 3px; background: var(--gold); }
.nav .dot { top: 0; right: calc(50% - 22px); box-shadow: 0 0 0 2px #fff; }
.nav .nav-more-only { display: none; }
.fab { position: fixed; z-index: 41; right: 16px; bottom: calc(80px + var(--safe-b)); width: 56px; height: 56px; border-radius: 18px; border: 0; cursor: pointer; display: grid; place-items: center; background: linear-gradient(160deg, #ffd978, #c9a25a); color: var(--sea); box-shadow: 0 10px 26px rgba(138,102,48,.45); }
.fab svg { width: 28px; height: 28px; }
@media (min-width: 900px) {
  .app { grid-template-columns: 236px 1fr; }
  .top { grid-column: 1 / -1; }
  .nav { position: sticky; top: 62px; align-self: start; height: calc(100dvh - 62px); grid-template-columns: 1fr; align-content: start; gap: 4px; padding: 16px 12px; border-top: 0; border-right: 1px solid var(--line); background: #fff; }
  .nav button { grid-auto-flow: column; justify-content: start; gap: 12px; padding: 12px 14px; font-size: 14.5px; }
  .nav button.on { background: #eef2f8; }
  .nav button.on::before { top: 10px; left: 0; width: 3px; height: 26px; }
  .nav .nav-more { display: none; } .nav .nav-more-only { display: grid; }
  .nav .dot { position: static; box-shadow: none; margin-left: auto; }
  main { padding: 22px 26px 60px; }
  .fab { bottom: 28px; right: 28px; }
}

/* ---------- elemek ---------- */
h2.vt { font: 800 26px/1.05 var(--display); letter-spacing: .03em; text-transform: uppercase; color: var(--sea); margin: 4px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2.vt small { font: 600 13px/1.2 var(--body); letter-spacing: 0; text-transform: none; color: var(--mut); }
h3.st { font: 800 13px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-d); margin: 22px 2px 10px; display: flex; align-items: center; gap: 8px; }
h3.st .n { background: var(--sea); color: #fff; border-radius: 99px; padding: 3px 8px; font-size: 11px; letter-spacing: 0; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 14px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mut { color: var(--mut); } .sm { font-size: 13px; } .xs { font-size: 12px; }
.btn { appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; font: 800 14.5px/1.1 var(--body); background: #eef1f5; color: var(--sea); text-decoration: none; }
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--sea); color: #fff; } .btn.gold { background: linear-gradient(160deg, #ffd978, #c9a25a); color: var(--sea); }
.btn.ok { background: var(--green); color: #fff; } .btn.warn { background: #fff4e3; color: #9a5a00; } .btn.bad { background: #fde9e7; color: #b3261e; }
.btn.line { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.seg { display: inline-grid; grid-auto-flow: column; background: #e8e3d7; border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 10px; font: 800 14px/1 var(--body); color: var(--mut); text-align: center; }
.seg button.on { background: #fff; color: var(--sea); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { all: unset; cursor: pointer; white-space: nowrap; padding: 8px 14px; border-radius: 99px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font: 700 13.5px/1 var(--body); color: var(--mut); display: inline-flex; gap: 6px; align-items: center; }
.chip.on { background: var(--sea); color: #fff; box-shadow: none; }
.chip .c { background: rgba(0,0,0,.08); border-radius: 99px; padding: 2px 7px; font-size: 11.5px; }
.chip.on .c { background: rgba(255,255,255,.2); }

/* állapotcímkék */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; font: 800 11.5px/1 var(--body); white-space: nowrap; }
.tag.pending { background: #fff1dc; color: #9a5a00; } .tag.approved { background: #e3edfd; color: #1d4fa8; } .tag.paid { background: #e1f4e9; color: #1d7446; }
.tag.block { background: #ebedf0; color: #4d5966; } .tag.rejected, .tag.cancelled, .tag.expired { background: #fbe7e5; color: #a3261e; }
.tag.src { background: #f1ece0; color: var(--gold-d); }
.apt-b { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 8px; background: var(--ac, var(--sea)); color: #fff; font: 900 14px/1 var(--display); letter-spacing: .02em; }

/* figyelmeztető kártyák */
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 14px; background: #fff; box-shadow: var(--sh); border-left: 5px solid var(--c, var(--gold)); }
.alert svg { width: 26px; height: 26px; color: var(--c, var(--gold)); margin-top: 1px; }
.alert b { display: block; font-size: 15px; }
.alert .acts { margin-top: 8px; }
.alert.waste { --c: #3c9a5f; background: linear-gradient(90deg, #eef8f1, #fff 60%); }
.alert.waste.today { --c: var(--orange); background: linear-gradient(90deg, #fff4e3, #fff 60%); }
.alert.pend { --c: var(--orange); } .alert.warn { --c: var(--red); } .alert.info { --c: var(--sky); }

/* napi / heti nézet */
.daybar { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; flex-wrap: wrap; }
.daybar .dn { font: 800 20px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--sea); flex: 1; min-width: 0; }
.daybar .dn small { display: block; font: 600 12.5px/1.3 var(--body); letter-spacing: 0; text-transform: none; color: var(--mut); }
.navbtn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; box-shadow: var(--sh); color: var(--sea); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.stat { background: #fff; border-radius: 14px; box-shadow: var(--sh); padding: 11px 10px; text-align: center; }
.stat b { display: block; font: 900 26px/1 var(--display); color: var(--sea); }
.stat span { font: 700 11px/1.2 var(--body); color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.stat.in b { color: var(--green); } .stat.out b { color: var(--red); }
.gcard { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: #fff; border-radius: 14px; box-shadow: var(--sh); padding: 12px; cursor: pointer; border-left: 5px solid var(--ac, var(--sea)); }
.gcard .nm { font-weight: 800; font-size: 15.5px; line-height: 1.2; }
.gcard .meta { font-size: 12.5px; color: var(--mut); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.gcard .acts { display: flex; gap: 6px; }
.call { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #e1f4e9; color: var(--green); }
.call.mail { background: #e3edfd; color: var(--blue); }
.empty { text-align: center; padding: 18px 12px; color: var(--mut); font-size: 13.5px; background: rgba(255,255,255,.55); border-radius: 14px; border: 1.5px dashed var(--line); }
.free { display: flex; gap: 6px; flex-wrap: wrap; }
.free span { padding: 6px 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 700; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.free i { width: 9px; height: 9px; border-radius: 50%; background: var(--ac); }
.swap { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 12px; background: #fff4e3; color: #8a4f00; font-size: 13px; font-weight: 700; }
.wk { display: grid; gap: 10px; }
.wkday { background: #fff; border-radius: 14px; box-shadow: var(--sh); overflow: hidden; }
.wkday.today { box-shadow: 0 0 0 2px var(--gold), var(--sh); }
.wkh { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--soft); border-bottom: 1px solid var(--line); cursor: pointer; }
.wkh .d { font: 900 22px/1 var(--display); color: var(--sea); width: 34px; text-align: center; }
.wkh .w { font-weight: 800; font-size: 14px; line-height: 1.1; } .wkh .w small { display: block; font-weight: 600; color: var(--mut); font-size: 12px; }
.wkh .sp { flex: 1; }
.wkb { padding: 8px 12px 10px; display: grid; gap: 6px; }
.mv { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 3px 0; }
.mv .ar { font: 900 12px/1 var(--body); width: 58px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.mv .ar.in { color: var(--green); } .mv .ar.out { color: var(--red); }
.mv .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wtag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 99px; background: color-mix(in srgb, var(--wc) 16%, #fff); color: color-mix(in srgb, var(--wc) 75%, #000); font: 800 11.5px/1 var(--body); }
.wtag svg { width: 13px; height: 13px; }
.occ { display: grid; grid-template-columns: 76px repeat(7, 1fr); gap: 3px; font-size: 11px; }
.occ .h { text-align: center; font-weight: 800; color: var(--mut); padding-bottom: 2px; }
.occ .a { font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; }
.occ .a i { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); flex: none; }
.occ .c { height: 22px; border-radius: 6px; background: #eef1f5; }
.occ .c.b { background: var(--ac); } .occ .c.p { background: repeating-linear-gradient(45deg, var(--ac) 0 4px, color-mix(in srgb, var(--ac) 45%, #fff) 4px 8px); } .occ .c.x { background: #b9c1ca; }

/* foglalások listája */
.search { position: relative; margin-bottom: 10px; }
.search input { width: 100%; padding: 12px 14px 12px 42px; border-radius: 14px; border: 0; background: #fff; box-shadow: var(--sh); font-size: 15px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--mut); }
.bk { display: grid; grid-template-columns: auto 1fr; gap: 12px; background: #fff; border-radius: 14px; box-shadow: var(--sh); padding: 12px; cursor: pointer; border-left: 5px solid var(--ac, var(--sea)); }
.bk .dt { text-align: center; min-width: 46px; } .bk .dt b { display: block; font: 900 24px/1 var(--display); color: var(--sea); } .bk .dt span { font: 800 11px/1 var(--body); text-transform: uppercase; color: var(--mut); }
.bk .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .bk .nm { font-weight: 800; font-size: 15px; }
.bk .l2 { font-size: 12.5px; color: var(--mut); margin-top: 4px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.bk.dim { opacity: .62; }

/* naptár (idővonal) */
.cal-wrap { background: #fff; border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
.cal-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cal { --w: 38px; position: relative; display: grid; grid-template-columns: 92px repeat(var(--n), var(--w)); min-width: max-content; }
.cal .hd { position: sticky; top: 0; height: 44px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--mut); border-bottom: 1px solid var(--line); background: #fff; line-height: 1.05; text-align: center; }
.cal .hd b { display: block; font: 900 15px/1 var(--display); color: var(--ink); }
.cal .hd.we { background: #faf7f0; } .cal .hd.td { background: var(--sea); color: #fff; } .cal .hd.td b { color: var(--gold-2); }
.cal .nm { position: sticky; left: 0; z-index: 3; background: #fff; display: flex; align-items: center; gap: 7px; padding: 0 8px; font-weight: 800; font-size: 13px; border-right: 1px solid var(--line); border-bottom: 1px solid #f0ece3; height: 46px; }
.cal .nm i { width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }
.cal .corner { position: sticky; left: 0; z-index: 4; background: #fff; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--mut); font-weight: 800; }
.cal .cell { height: 46px; border-bottom: 1px solid #f0ece3; border-left: 1px solid #f5f2ea; cursor: pointer; }
.cal .cell.we { background: #fcfaf5; } .cal .cell.td { background: #eef3fb; }
.cal .wrow { height: 26px; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
.cal .wrow i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--wc); color: #fff; }
.cal .wrow i svg { width: 10px; height: 10px; }
.cal .nm.wl { height: 26px; font-size: 11.5px; color: var(--mut); border-bottom: 1px solid var(--line); }
.bar { position: absolute; height: 32px; border-radius: 9px; background: var(--ac); color: #fff; font: 800 12px/32px var(--body); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.bar.pending, .bar.approved { background: repeating-linear-gradient(45deg, var(--ac) 0 6px, color-mix(in srgb, var(--ac) 70%, #fff) 6px 12px); }
.bar.block { background: #8c97a3; } .bar.ext { box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mut); padding: 10px 12px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; gap: 6px; align-items: center; } .legend i { width: 18px; height: 10px; border-radius: 3px; background: var(--sea-3); }

/* űrlapok */
.f { display: grid; gap: 6px; } .f > span { font: 700 12.5px/1.2 var(--body); color: var(--mut); }
.f input, .f select, .f textarea { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 15.5px; min-height: 46px; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px rgba(42,134,173,.15); }
.f textarea { min-height: 80px; resize: vertical; }
.f .hint { font-size: 12px; color: var(--mut); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.suf { position: relative; } .suf input { padding-right: 44px; } .suf i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 13px; color: var(--mut); font-weight: 700; }
.sw { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
.sw input { appearance: none; width: 48px; height: 28px; border-radius: 99px; background: #cfd5dc; position: relative; cursor: pointer; flex: none; transition: background .2s; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.sw input:checked { background: var(--green); } .sw input:checked::after { transform: translateX(20px); }
.sw b { display: block; font-size: 14.5px; } .sw small { color: var(--mut); font-size: 12.5px; }
.radio { display: grid; gap: 8px; }
.radio label { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
.radio label:has(input:checked) { box-shadow: inset 0 0 0 2px var(--sea); background: #f3f6fb; }
.radio input { accent-color: var(--sea); width: 20px; height: 20px; margin: 1px 0 0; flex: none; }
.radio b { display: block; } .radio small { color: var(--mut); font-size: 12.5px; }
details.sec { background: #fff; border-radius: var(--r); box-shadow: var(--sh); margin-bottom: 10px; }

/* értesítő buborék, betöltés */
.toast { position: fixed; z-index: 120; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); background: var(--sea-2); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 32px); animation: up .25s; }
.toast.err { background: #b3261e; }
.busy { position: fixed; z-index: 110; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); background-size: 50% 100%; animation: load 1s linear infinite; }
@keyframes load { from { background-position: -50% 0; } to { background-position: 150% 0; } }

@keyframes sk { to { background-position: -200% 0; } }
.help { font-size: 12.5px; color: var(--mut); background: #fff; border-radius: 12px; padding: 10px 12px; border: 1px dashed var(--line); }

/* ==========================================================================
   Zephyr Apartmanház – admin app
   A foglalási rendszer (virtualis-seta/api/index.php) teljes kezelése egy helyen:

   hulladékszállítás emlékeztetővel, programok, árak és minden beállítás.

(function () {

  const API = "../virtualis-seta/api/index.php?r=";

  const HU_MS = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
  const WD = ["vasárnap", "hétfő", "kedd", "szerda", "csütörtök", "péntek", "szombat"];
  const WDS = ["V", "H", "K", "Sze", "Cs", "P", "Szo"];
  const ST = { pending: "Jóváhagyásra vár", approved: "Előlegre vár", paid: "Végleges", rejected: "Elutasítva", cancelled: "Törölve", expired: "Lejárt", block: "Zárolva" };
  const SRC = { airbnb: "Airbnb", szallas: "Szállás.hu", egyeb: "Külső naptár", manual: "Kézi", web: "Weboldal" };
  const BLOCKING = ["pending", "approved", "paid", "block"];
  const CATS = { fesztival: "Fesztivál", koncert: "Koncert", sport: "Sport", gasztro: "Gasztro", kultura: "Kultúra", csalad: "Családi", egyeb: "Egyéb" };
  const WCOLORS = ["#5b6b7a", "#2a86ad", "#f2b233", "#3c9a5f", "#8a6630", "#e2483d", "#7a5cc2"];

  /* ---------- segédek ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ico = (n, cls = "i") => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
  const money = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft";
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const pd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const nightsOf = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const hu = (s) => { if (!s) return "–"; const d = pd(s); return d.getFullYear() + ". " + HU_M[d.getMonth()] + " " + d.getDate() + "."; };
  const huS = (s) => { const d = pd(s); return HU_MS[d.getMonth()] + " " + d.getDate() + "."; };
  const wd = (s) => WD[pd(s).getDay()];
  const tel = (p) => String(p || "").replace(/[^\d+]/g, "");
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

  /* ==========================================================================
     API (vagy bemutató mód)

  async function api(r, body) {

    try {
      const res = await fetch(API + r, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Zephyr-Token": A.tok }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
      let j = null; try { j = await res.json(); } catch (e) { throw Object.assign(new Error("A szerver nem válaszolt megfelelően. (Csak a tárhelyen, PHP-val működik.)"), { offline: true }); }

  function toast(msg, err) { $$(".toast").forEach((t) => t.remove()); const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5200 : 3200); }
  async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }

  async function loadAll() {
    const [d, w] = await Promise.all([api("bookings"), api("waste").catch(() => null)]);
    A.data = d; A.waste = w;

  }
  async function loadEvents() { A.events = (await api("events_all")).events; }

  /* ---------- bemutató mód (a weboldal előnézetéhez, szerver nélkül) ---------- */
  const Demo = (() => {
    let D = null;
    function seed() {
      const t = ymd(new Date());
      const apts = [["korvett", "Korvett", 1, 4, "#e2483d"], ["dingi", "Dingi", 2, 2, "#3fb37f"], ["fregatt", "Fregatt", 3, 4, "#3d8fe2"], ["kaloz", "Kalóz", 4, 2, "#9b6be2"], ["schooner", "Schooner", 5, 4, "#2bb3c0"]]
        .map(([id, name, no, cap, color]) => ({ id, name, no, cap, price: cap > 2 ? 30000 : 22000, color, active: 1 }));

    const num = (k, l, suf, min, max, hint) => `<label class="f"><span>${l}</span><span class="suf"><input type="number" data-s="${k}" value="${esc(s[k])}" min="${min}" max="${max}" inputmode="numeric">${suf ? `<i>${suf}</i>` : ""}</span>${hint ? `<span class="hint">${hint}</span>` : ""}</label>`;
    const txt = (k, l, ph, type) => `<label class="f"><span>${l}</span><input type="${type || "text"}" data-s="${k}" value="${esc(s[k])}" placeholder="${esc(ph || "")}"></label>`;
    const sec = (ic, title, sub, body, open) => `<details class="sec" ${open ? "open" : ""}><summary><span class="ic">${ico(ic)}</span><span>${title}<small>${sub}</small></span></summary><div class="in">${body}</div></details>`;
    const links = A.data.ical_links || {};
    let h = `<h2 class="vt">Beállítások</h2>`;
    h += sec("money", "Árak szezononként", "alapár / éj apartmanonként és időszakonként", `
      <div class="tbl-wrap"><table class="pt"><thead><tr><th></th>${s.seasons.map((x, j) => `<th><input data-se="${j}" data-k="name" value="${esc(x.name)}" aria-label="Időszak neve"><span class="row" style="gap:3px;flex-wrap:nowrap"><input data-se="${j}" data-k="from" value="${esc(x.from)}" maxlength="5" style="width:62px;padding:7px 4px;text-align:center" aria-label="Kezdete">–<input data-se="${j}" data-k="to" value="${esc(x.to)}" maxlength="5" style="width:62px;padding:7px 4px;text-align:center" aria-label="Vége"></span></th>`).join("")}</tr></thead>
      <tbody>${aps.map((a) => `<tr><th><span class="row" style="gap:6px;flex-wrap:nowrap">${aptB(a.id)}${esc(a.name)}</span></th>${s.seasons.map((x, j) => `<td><input type="number" step="500" min="0" data-sp="${j}" data-apt="${a.id}" value="${esc((x.prices || {})[a.id] || "")}" aria-label="${esc(a.name)} ${esc(x.name)}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="mut xs" style="margin:0">Az időszak határai hó-nap formában (pl. 07-01). Az utolsó nap az utolsó éjszaka napja. Szezonon kívül az apartman alapára él.</p>
      <label class="sw"><input type="checkbox" data-s="prices_checked" ${+s.prices_checked ? "checked" : ""}><span><b>Az árakat ellenőriztem</b><small>eltűnik a figyelmeztetés</small></span></label>
      ${num("weekend_pct", "Hétvégi felár (péntek, szombat éj)", "%", 0, 100)}`, false);
    h += sec("cal", "Időszakos árak", "egyedi ár egy adott időszakra (pl. fesztivál)", `
      <div class="stack" id="prs">${(s.price_rules || []).map((r, i) => `<div class="mini-row">
        <label class="f"><span>Ettől</span><input type="date" data-pr="${i}" data-k="from" value="${esc(r.from)}"></label>
        <label class="f"><span>Eddig</span><input type="date" data-pr="${i}" data-k="to" value="${esc(r.to)}"></label>
        <label class="f"><span>Apartman</span><select data-pr="${i}" data-k="apt"><option value="all">Mind</option>${aps.map((a) => `<option value="${a.id}" ${r.apt === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
        <label class="f"><span>Ár / éj</span><input type="number" step="500" data-pr="${i}" data-k="price" value="${esc(r.price)}"></label>
        <button class="x-btn" data-prdel="${i}" aria-label="Törlés">${ico("x")}</button></div>`).join("") || `<div class="empty">Nincs időszakos ár.</div>`}</div>
      <button class="btn line sm" id="prAdd" style="justify-self:start">${ico("plus")}Időszakos ár</button>`);
    h += sec("bed", "Apartmanok", "név, férőhely, alapár, kiadható-e", aps.map((a, i) => `
      <div class="mini-row" style="grid-template-columns:auto 1fr 90px 120px auto">
        ${aptB(a.id)}
        <label class="f"><span>Név</span><input data-ap="${i}" data-k="name" value="${esc(a.name)}"></label>
        <label class="f"><span>Férőhely</span><input type="number" min="1" max="12" data-ap="${i}" data-k="cap" value="${esc(a.cap)}"></label>
        <label class="f"><span>Alapár / éj</span><input type="number" step="500" data-ap="${i}" data-k="price" value="${esc(a.price)}"></label>
        <label class="sw" style="padding:0" title="Kiadható"><input type="checkbox" data-ap="${i}" data-k="active" ${+a.active ? "checked" : ""}></label></div>`).join("") + `<p class="mut xs" style="margin:0">A kikapcsolt apartman nem foglalható a weboldalon.</p>`);
    h += sec("lock", "Foglalási szabályok", "éjszakák, előleg, határidők, adó", `
      <div class="grid2">${num("min_nights", "Minimum éjszaka", "éj", 1, 60)}${num("max_nights", "Maximum éjszaka", "éj", 1, 120)}</div>
      <div class="grid2">${num("lead_days", "Legkorábban ennyi nappal előre", "nap", 0, 60, "0 = aznapra is")}${num("horizon_days", "Legfeljebb ennyi napra előre", "nap", 30, 420)}</div>
      <div class="grid2">${num("deposit_pct", "Előleg", "%", 0, 100)}${num("tax", "Idegenforgalmi adó / fő / éj", "Ft", 0, 100000, "18 év felett")}</div>
      <div class="grid2">${num("pending_days", "Kérés jóváhagyási ideje", "nap", 1, 14, "utána lejár")}${num("pay_days", "Előleg fizetési határidő", "nap", 1, 30)}</div>
      <div class="grid2">${txt("checkin", "Érkezés ettől", "14:00")}${txt("checkout", "Távozás eddig", "10:00")}</div>
      <div class="grid2">${txt("season_from", "Foglalható szezon kezdete (hó-nap)", "05-15")}${txt("season_to", "Szezon vége (hó-nap)", "10-15")}</div>`);
    h += sec("phone", "Kapcsolat és fizetés", "elérhetőség, bankszámla, SZÉP-kártya, NTAK", `
      <div class="grid2">${txt("phone", "Telefon", "", "tel")}${txt("email", "E-mail (a vendégeknek)", "", "email")}</div>
      ${txt("address", "Cím")}${txt("ntak", "NTAK regisztrációs szám")}
      <div class="grid2">${txt("bank_holder", "Számlatulajdonos")}${txt("bank_name", "Bank neve")}</div>
      ${txt("bank_account", "Bankszámlaszám", "12345678-12345678-12345678")}
      <div class="grid2">${txt("bank_iban", "IBAN (külföldi utaláshoz)")}${txt("bank_swift", "SWIFT/BIC")}</div>
      ${txt("bank_address", "Bank címe (külföldi utaláshoz)")}
      <div class="grid3">${txt("szep_otp", "OTP SZÉP szerződésszám")}${txt("szep_mbh", "MBH SZÉP azonosító")}${txt("szep_kh", "K&H SZÉP azonosító")}</div>
      <div class="grid2">${txt("rules_url", "Házirend linkje", "üresen: Kellékek/hazirend.pdf")}${txt("privacy_url", "Adatkezelési tájékoztató linkje", "üresen: Kellékek mappa")}</div>`);
    h += sec("mail", "Értesítések", "új foglalásról e-mail", `
      ${txt("notify_email", "Új foglalásról ide jön értesítés", "", "email")}
      <button class="btn line sm" id="testMail" style="justify-self:start">${ico("mail")}Próba e-mail</button>
      <div class="help">A hulladék- és vendégfogadás-emlékeztető a <b>Hulladék</b> fülön állítható.</div>`);
    h += sec("sync", "Naptárszinkron", "Szállás.hu, Airbnb, Google Naptár", `
      <p class="mut sm" style="margin:0"><b>Behozott naptárak</b> – a platformok iCal exportlinkje. A foglalásaik itt zárolják a napokat.</p>
      ${aps.filter((a) => +a.active).map((a) => `<div class="card" style="box-shadow:none;background:var(--soft)"><div class="row" style="margin-bottom:8px">${aptB(a.id)}<b>${esc(a.name)}</b></div><div class="stack">
        ${[["szallas", "Szállás.hu"], ["airbnb", "Airbnb"], ["egyeb", "Egyéb"]].map(([k, l]) => `<label class="f"><span>${l} naptár linkje</span><input data-ical="${a.id}" data-src="${k}" value="${esc(((s.ical || {})[a.id] || {})[k] || "")}" placeholder="https://…"></label>`).join("")}</div>
        ${links[a.id] ? `<p class="mut xs" style="margin:10px 0 6px"><b>Kiküldés</b> – ezt add meg a platformnál:</p>
        <div class="stack"><div class="copy"><input readonly value="${esc(links[a.id].szallas)}" id="lk_${a.id}_sz"><button class="btn sm line" data-copy="lk_${a.id}_sz">Szállás.hu</button></div>
        <div class="copy"><input readonly value="${esc(links[a.id].airbnb)}" id="lk_${a.id}_ab"><button class="btn sm line" data-copy="lk_${a.id}_ab">Airbnb</button></div></div>` : ""}</div>`).join("")}
      ${links.google ? `<div class="copy"><input readonly value="${esc(links.google)}" id="lk_g"><button class="btn sm line" data-copy="lk_g">Google (részletes)</button></div>` : ""}
      ${Object.keys(s.sync_log || {}).length ? `<div class="log">${Object.entries(s.sync_log).map(([k, l]) => `<span>${l.ok ? "✔" : "✖"} ${esc(k)}: ${esc(l.msg || "")}</span>`).join("")}</div>` : ""}
      <div class="row"><button class="btn line sm" id="syncNow">${ico("sync")}Szinkron most</button><label class="sw" style="padding:0"><input type="checkbox" data-s="regen_ical_key"><span><b>Új titkos kulcs mentéskor</b><small>a régi linkek megszűnnek</small></span></label></div>`);
    h += sec("lock", "Jelszó", "belépési jelszó megváltoztatása", `
      <label class="f"><span>Jelenlegi jelszó</span><input type="password" id="pw0" autocomplete="current-password"></label>
      <label class="f"><span>Új jelszó (legalább 8 karakter)</span><input type="password" id="pw1" autocomplete="new-password"></label>
      <button class="btn line" id="pwSave" style="justify-self:start">${ico("lock")}Jelszó módosítása</button>`, A.data.initial);
    h += `<div class="row" style="margin-top:14px"><button class="btn bad" id="logout">${ico("door")}Kijelentkezés</button><a class="btn line" href="../uj/" target="_blank" rel="noopener">${ico("link")}Weboldal</a></div>`;
    h += `<div class="savebar"><button class="btn line" id="sReset">Elvetés</button><button class="btn pri" id="sSave">${ico("check")}Beállítások mentése</button></div>`;
    m.innerHTML = h;

    const dirty = () => { const b = $("#sSave", m); b.classList.add("gold"); b.classList.remove("pri"); };
    m.oninput = m.onchange = (e) => {
      const el = e.target, v = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value; let hit = true;
      if (el.dataset.s) s[el.dataset.s] = el.type === "number" ? +v : v;
      else if (el.dataset.se != null) s.seasons[+el.dataset.se][el.dataset.k] = v;
      else if (el.dataset.sp != null) { const x = s.seasons[+el.dataset.sp]; x.prices = x.prices || {}; x.prices[el.dataset.apt] = +v; }
      else if (el.dataset.pr != null) s.price_rules[+el.dataset.pr][el.dataset.k] = el.dataset.k === "price" ? +v : v;
      else if (el.dataset.ap != null) aps[+el.dataset.ap][el.dataset.k] = el.type === "number" ? +v : v;
      else if (el.dataset.ical) { s.ical = s.ical || {}; s.ical[el.dataset.ical] = s.ical[el.dataset.ical] || {}; s.ical[el.dataset.ical][el.dataset.src] = v; }
      else hit = false;
      if (hit) dirty();
    };
    m.onclick = async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.id === "prAdd") { s.price_rules = (s.price_rules || []).concat([{ from: A.data.today, to: addD(A.data.today, 2), apt: "all", price: 0 }]); keepOpen(() => viewSettings(m)); dirty(); }
      else if (b.dataset.prdel != null) { s.price_rules.splice(+b.dataset.prdel, 1); keepOpen(() => viewSettings(m)); dirty(); }
      else if (b.id === "sReset") { SED = null; viewSettings(m); toast("Módosítások elvetve."); }
      else if (b.id === "sSave") run(async () => {
        const out = { ...s }; ["sync_log", "ical_key", "last_sync", "ext_ignored", "mig_otp"].forEach((k) => delete out[k]);
        const j = await api("save_settings", { settings: out }); SED = null; await loadAll(); toast(j.message); keepOpen(() => viewSettings(m));
      });
      else if (b.id === "testMail") run(async () => { const j = await api("test_mail", {}); toast(j.message, !j.ok); });
      else if (b.id === "syncNow") run(async () => { const j = await api("sync", {}); toast(j.message); await loadAll(); SED = null; keepOpen(() => viewSettings(m)); });
      else if (b.id === "pwSave") run(async () => { const j = await api("password", { old: $("#pw0", m).value, new: $("#pw1", m).value }); A.data.initial = false; toast(j.message); $("#pw0", m).value = $("#pw1", m).value = ""; });
      else if (b.id === "logout") logout();
      else if (b.dataset.copy) copyVal($("#" + b.dataset.copy, m).value);
    };
    function keepOpen(fn) { const open = $$("details.sec", m).map((d) => d.open); const y = scrollY; fn(); $$("details.sec", m).forEach((d, i) => (d.open = !!open[i])); scrollTo(0, y); }
  }

  /* ==========================================================================
     Indítás
     ========================================================================== */
  async function start() {
    shell();
    $("#main").innerHTML = `<div class="stack"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
    try { await loadAll(); if (A.view === "prog") await loadEvents(); render(); }
    catch (e) { if (A.tok || A.demo) loginView(e.message); }
  }
  /* visszatéréskor (pl. telefon felébresztése) friss adatok */
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && A.data && !$(".sheet")) run(async () => { await loadAll(); render(); }); });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (/[?&]demo\b/.test(location.search)) { A.demo = true; start(); }
  else if (A.tok) start(); else loginView();
})();
</script>
</body>
</html>
