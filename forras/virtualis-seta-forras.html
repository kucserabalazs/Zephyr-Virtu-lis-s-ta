<title>Zephyr Virtuális Séta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: teljes képernyős 360° panoráma; bal felül helyszín-tábla, alatta lakásválasztó, alul helyszín-szalag, bal oldalt lenyitható alaprajz. Egyetlen sötét "balatoni este" megjelenés. */
:root {
  --boat: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M31%206v40%22%20stroke%3D%22%23000%22%20stroke-width%3D%222.4%22/%3E%3Cpath%20d%3D%22M33%208c9%209%2014%2022%2014%2034H33z%22/%3E%3Cpath%20d%3D%22M29%2014C22%2022%2017%2032%2016%2042h13z%22/%3E%3Cpath%20d%3D%22M31%206l8%203-8%203z%22/%3E%3Cpath%20d%3D%22M8%2047h48l-7%209H15z%22/%3E%3C/svg%3E");
  --boat-w: url("data:image/svg+xml,%3Csvg%20fill%3D%22%23fff%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M31%206v40%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22/%3E%3Cpath%20d%3D%22M33%208c9%209%2014%2022%2014%2034H33z%22/%3E%3Cpath%20d%3D%22M29%2014C22%2022%2017%2032%2016%2042h13z%22/%3E%3Cpath%20d%3D%22M31%206l8%203-8%203z%22/%3E%3Cpath%20d%3D%22M8%2047h48l-7%209H15z%22/%3E%3C/svg%3E");
  --night: #0c1a26;
  --night-2: #142b3d;
  --glass: rgba(12, 26, 38, 0.76);
  --line: rgba(214, 228, 236, 0.20);
  --fg: #eef3f5;
  --muted: #a9bcc7;
  --signal: #e2483d;
  --sail: #f4f1e6;
  --room: rgba(214, 228, 236, 0.07);
  --room-line: rgba(214, 228, 236, 0.55);
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage a-scene { position: absolute; inset: 0; }
button { font: inherit; }

.top {
  position: fixed; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; align-items: flex-start; pointer-events: none;
}
.top > * { pointer-events: auto; }
.plate {
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px 11px; display: grid; gap: 2px; min-width: 0; max-width: 420px;
}
.plate { position: relative; overflow: hidden; }
.plate::after { content: ""; position: absolute; right: -6px; bottom: -8px; width: 74px; height: 74px; background: #fff; opacity: .07; -webkit-mask: var(--boat) center / contain no-repeat; mask: var(--boat) center / contain no-repeat; transform: rotate(-6deg); pointer-events: none; }
.plate .house { font: 600 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.loader-logo { display: block; width: min(320px, 70vw); height: auto; margin: 0 auto 14px; filter: drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 8px rgba(255,255,255,.4)); }
.plate .house .logo { height: 34px; width: auto; display: block; filter: drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 5px rgba(255,255,255,.45)); }
.plate .unit { font: 800 13px/1.3 var(--body); color: var(--signal); letter-spacing: .06em; text-transform: uppercase; }
.plate .unit:empty { display: none; }
.plate .place { font: 800 26px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
/* ---- Forgatható üvegkocka (bal felül) – a tulajdonos 6–7. mintaképe szerint ----
   Nyugalomban is térben áll: kissé elfordítva és felülről nézve, jobbra a felénk néző (aktív) lap,
   balra keskenyen a szomszédja. Lapok: 1 helyszín · 2 MAP · 3 BACK · 4 HOME. Teteje/alja tiszta üveg. */
.cubebox { --S: 186px; --H: 116px; --gp: 12px; position: relative; flex: none; width: calc(var(--S) * 1.5); display: grid; justify-items: center; padding-top: calc(var(--H) * .5); box-sizing: border-box; }
.cube3d { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); pointer-events: none; }
.cube-stage.is3d .cube { display: none; }
.cube-stage { width: var(--S); height: var(--H); perspective: calc(var(--S) * 4.6); perspective-origin: 50% 0%; position: relative; touch-action: none; cursor: grab; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.cube-stage img { -webkit-user-drag: none; pointer-events: none; }
.cube-stage.drag { cursor: grabbing; }
/* lebegés: többrétegű, lágy árnyék és halvány kék derengés a kocka alatt */
.cube-stage::before { content: ""; position: absolute; left: 4%; right: 4%; top: 100%; height: calc(var(--H) * .5); margin-top: calc(var(--H) * .2); pointer-events: none; z-index: -1;
  background: radial-gradient(50% 38% at 50% 50%, rgba(3,14,32,.34), rgba(3,14,32,.14) 55%, transparent 100%), radial-gradient(60% 50% at 50% 46%, rgba(120,190,255,.22), transparent 75%);
  filter: blur(calc(var(--H) * .07)); }
.cube-stage:focus-visible::after { content: ""; position: absolute; inset: -14px -30px; border-radius: 24px; outline: 2px solid #bfe6ff; }
.cube { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2,1.2,.35,1); will-change: transform; }
.cube-stage.drag .cube, .cube.instant { transition: none; }
.cube-stage.press .cube { transform: var(--rot) scale(.93); transition: transform .12s; }
/* egy oldal: vastag kristályüveg keret + fedett sötétkék (Home: piros) panel */
.cf { position: absolute; left: 0; top: 0; width: var(--S); height: var(--H); box-sizing: border-box; border-radius: calc(var(--S) * .2); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background:
    linear-gradient(118deg, rgba(255,255,255,0) 26%, rgba(255,255,255,.55) 31%, rgba(255,255,255,0) 37%),
    linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(205,232,255,.45) 9%, rgba(110,165,225,.42) 30%, rgba(60,120,200,.5) 50%, rgba(120,180,235,.45) 72%, rgba(215,238,255,.6) 90%, rgba(255,255,255,.95) 100%);
  box-shadow:
    inset 0 0 calc(var(--gp) * .55) calc(var(--gp) * .2) rgba(255,255,255,.75),
    inset 0 0 calc(var(--gp) * 1.4) rgba(160,210,255,.45),
    inset 2px 3px 8px rgba(255,255,255,.8),
    inset -2px -3px 8px rgba(25,80,150,.3);
  filter: brightness(var(--lit, 1)); }
.cf::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; mix-blend-mode: screen;
  background:
    linear-gradient(112deg, transparent 0 calc(var(--sh, 30%) - 9%), rgba(255,255,255,.22) var(--sh, 30%), transparent calc(var(--sh, 30%) + 9%)),
    radial-gradient(calc(var(--S) * .2) calc(var(--S) * .08) at 22% 4%, #fff, transparent 70%),
    radial-gradient(calc(var(--S) * .07) calc(var(--S) * .24) at 3% 34%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(calc(var(--S) * .16) calc(var(--S) * .07) at 80% 97%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(calc(var(--S) * .06) calc(var(--S) * .16) at 97% 22%, rgba(255,255,255,.85), transparent 70%); }
.cf-in { position: absolute; inset: var(--gp); border-radius: calc(var(--S) * .09); overflow: hidden; box-sizing: border-box; display: grid; grid-template-columns: 100%; place-items: center; align-content: center; gap: 0; text-align: center; padding: 4px 6px 6px; opacity: var(--cv, 1);
  background: linear-gradient(180deg, #16325a 0%, #0f2747 38%, #0a1b35 100%);
  box-shadow: 0 0 0 1.5px rgba(6,18,38,.95), 0 0 0 2.6px rgba(255,255,255,.28), inset 0 1px 0 rgba(255,255,255,.22), inset 0 8px 16px rgba(255,255,255,.06), inset 0 -10px 18px rgba(0,0,0,.42); }
.cf-in::before { content: ""; position: absolute; inset: 0; background: linear-gradient(172deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.03) 30%, transparent 44%); pointer-events: none; }
.cf-red .cf-in { background: linear-gradient(180deg, #ff4b3d 0%, #e3231a 40%, #b5120c 100%); box-shadow: 0 0 0 1.5px rgba(80,6,4,.9), 0 0 0 2.6px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.45), inset 0 10px 20px rgba(255,255,255,.18), inset 0 -10px 20px rgba(80,0,0,.35); }
.cf-red .cf-in::before { background: linear-gradient(172deg, rgba(255,255,255,.3) 0%, rgba(255,255,255,.07) 34%, transparent 48%); }
.cf-ico { height: calc(var(--S) * .44); width: auto; position: relative; filter: drop-shadow(0 4px 5px rgba(0,0,0,.45)); transition: transform .3s; }
.cf-lbl { position: relative; font: 800 calc(var(--S) * .21)/1.05 var(--display); letter-spacing: .01em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.45); margin-top: 2px; }
.cube-stage:hover .cf-front .cf-ico { transform: scale(1.06) translateY(-2px); }
.cf1 { transform: rotateY(0deg) translateZ(calc(var(--S) / 2)); }
.cf2 { transform: rotateY(90deg) translateZ(calc(var(--S) / 2)); }
.cf3 { transform: rotateY(180deg) translateZ(calc(var(--S) / 2)); }
.cf4 { transform: rotateY(-90deg) translateZ(calc(var(--S) / 2)); }
.cf5, .cf6 { height: var(--S); top: calc((var(--H) - var(--S)) / 2); }
.cf5 { transform: rotateX(90deg) translateZ(calc(var(--H) / 2)); }
.cf6 { transform: rotateX(-90deg) translateZ(calc(var(--H) / 2)); }
.tools.tools-flash .tool { animation: toolsFlash 1.6s ease; }
@keyframes toolsFlash { 0%, 100% { box-shadow: none; } 25%, 65% { box-shadow: 0 0 0 3px #9fdcff, 0 0 18px rgba(140,210,255,.9); } }
.inv-pick { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(6,16,30,.55); padding: 16px; }
.inv-card { position: relative; width: min(380px, 100%); border-radius: 22px; padding: 20px 20px 18px; color: #fff; background: linear-gradient(180deg, #17345c, #0a1b35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 20px 50px rgba(0,0,0,.45); }
.inv-card h3 { margin: 0 0 4px; font: 800 26px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.inv-card p { margin: 0 0 14px; color: #c9d8e6; font-size: 14px; }
.inv-list { display: grid; gap: 8px; }
.inv-list button { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; background: rgba(255,255,255,.1); font: 800 17px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.inv-list button:hover, .inv-list button:focus-visible { background: rgba(255,255,255,.22); }
.inv-list b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #e2483d; font-size: 15px; }
.inv-x { all: unset; cursor: pointer; position: absolute; right: 12px; top: 10px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.14); font: 700 22px/1 sans-serif; }
/* lekerekített üvegélek a lapok találkozásánál – mint egy üveg dobókockán */
.ce { position: absolute; top: calc(var(--S) * .06); height: calc(var(--H) - var(--S) * .12); width: calc(var(--S) * .2); left: calc(50% - var(--S) * .1); pointer-events: none; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(200,230,255,.35) 18%, rgba(255,255,255,.95) 44%, rgba(120,175,235,.55) 62%, rgba(230,245,255,.6) 82%, rgba(255,255,255,0) 100%);
  filter: blur(1.4px) brightness(var(--lit, 1)); }
.ce1 { transform: rotateY(45deg) translateZ(calc(var(--S) * .675)); } .ce2 { transform: rotateY(135deg) translateZ(calc(var(--S) * .675)); }
.ce3 { transform: rotateY(225deg) translateZ(calc(var(--S) * .675)); } .ce4 { transform: rotateY(315deg) translateZ(calc(var(--S) * .675)); }
/* teteje: tiszta üveglap, lágy, lekerekített peremmel */
.cf-top { pointer-events: none; position: absolute; left: 0; width: var(--S); height: var(--S); top: calc((var(--H) - var(--S)) / 2); box-sizing: border-box; border-radius: calc(var(--S) * .2); transform: rotateX(90deg) translateZ(calc(var(--H) / 2)); backface-visibility: hidden;
  background: radial-gradient(70% 70% at 40% 40%, rgba(255,255,255,.35), rgba(180,220,255,.18) 60%, rgba(255,255,255,.55));
  box-shadow: inset 0 0 calc(var(--gp) * .7) calc(var(--gp) * .25) rgba(255,255,255,.8), inset 0 0 calc(var(--gp) * 1.6) rgba(170,215,255,.5); filter: blur(.4px); }
/* 1. oldal: helyszín */
.cf1 .cf-in.plate { all: unset; position: absolute; inset: var(--gp); border-radius: calc(var(--S) * .09); overflow: hidden; box-sizing: border-box; display: grid; align-content: center; justify-items: start; gap: 0; padding: 4px calc(var(--S) * .09) 6px; text-align: left; opacity: var(--cv, 1);
  background: linear-gradient(180deg, #16325a 0%, #0f2747 38%, #0a1b35 100%);
  box-shadow: 0 0 0 1.5px rgba(6,18,38,.95), 0 0 0 2.6px rgba(255,255,255,.28), inset 0 1px 0 rgba(255,255,255,.22), inset 0 8px 16px rgba(255,255,255,.06), inset 0 -10px 18px rgba(0,0,0,.42); }
.cf1 .cf-in.plate::before { content: ""; position: absolute; inset: 0; background: linear-gradient(172deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.03) 30%, transparent 44%); pointer-events: none; }
.cf1 .plate::after { display: none; content: ""; position: absolute; right: -6%; bottom: -8%; width: 70%; height: 100%; background: #2a4c7c; opacity: .6; -webkit-mask: var(--boat) center / contain no-repeat; mask: var(--boat) center / contain no-repeat; pointer-events: none; }
.cf1 .plate .house { display: none; }
.cf1 .plate .unit { position: relative; z-index: 1; white-space: nowrap; font: 800 var(--uf, calc(var(--S) * .15))/1.05 var(--display); letter-spacing: .01em; text-transform: uppercase; color: #ff2d22; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.cf1 .plate .unit:empty { display: none; }
.cf1 .plate .place { position: relative; z-index: 1; font: 800 var(--pf, calc(var(--S) * .3))/.95 var(--display); letter-spacing: .01em; text-transform: uppercase; color: #fff; text-wrap: balance; overflow-wrap: anywhere; max-width: 100%; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
/* íves forgatásjelző nyíl a kocka alatt */
.cube-swoosh { width: calc(var(--S) * 1.15); height: calc(var(--S) * .17); margin-top: calc(var(--H) * .42); pointer-events: none; overflow: visible; }
.cube-swoosh .arc { fill: none; stroke: url(#swooshG); stroke-width: 5; stroke-linecap: round; }
.cube-swoosh .glow { fill: none; stroke: rgba(140,210,255,.55); stroke-width: 11; stroke-linecap: round; filter: blur(3px); }
.cube-swoosh .hd { fill: #e9f7ff; filter: drop-shadow(0 0 4px rgba(140,210,255,.9)); }
.cube-swoosh g { animation: swoosh 2.4s ease-in-out infinite; }
@keyframes swoosh { 0%, 100% { transform: translateX(-4px); opacity: .8; } 50% { transform: translateX(5px); opacity: 1; } }
.cube-stage.glint .cf-front::before { animation: glint 1.2s ease-in-out; }
@keyframes glint { from { background-position: -220px 0, 0 0, 0 0, 0 0, 0 0; } to { background-position: 320px 0, 0 0, 0 0, 0 0, 0 0; } }
:root[data-device="tablet"] .cubebox { --S: 176px; --H: 110px; --gp: 11px; }
:root[data-device="phone"] .cubebox { --S: 124px; --H: 78px; --gp: 8px; }
@media (prefers-reduced-motion: reduce) { .cube { transition-duration: .01s; } .cube-swoosh g { animation: none; } }
.tools { margin-left: auto; display: flex; gap: 8px; flex: none; }
.tool {
  all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; box-sizing: border-box;
  background: var(--glass); border: 1px solid var(--line); color: var(--fg);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tool:hover { background: var(--night-2); }
.tool:focus-visible { outline: 2px solid var(--sail); outline-offset: 2px; }
.tool[aria-pressed="true"] { color: var(--signal); border-color: var(--signal); }
.tool svg { width: 20px; height: 20px; }

.bottom {
  position: fixed; z-index: 5; left: 0; right: 0;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px;
}
.tabs, .strip {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(96px, calc(env(safe-area-inset-right, 0px) + 96px));
}
.tabs::-webkit-scrollbar, .strip::-webkit-scrollbar { display: none; }
.tab {
  all: unset; cursor: pointer; flex: none; box-sizing: border-box;
  padding: 7px 12px 6px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; gap: 7px; align-items: baseline;
}
.tab b { font: 800 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.tab b::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -1px; background: currentColor; opacity: .7; -webkit-mask: var(--boat) center / contain no-repeat; mask: var(--boat) center / contain no-repeat; }
.tab[aria-current="true"] b::before { opacity: 1; animation: tabBob 2.4s ease-in-out infinite; }
@keyframes tabBob { 50% { transform: translateY(-2px) rotate(-5deg); } }
.tab small { font: 600 11px/1 var(--body); color: var(--muted); }
.tab:hover { background: var(--night-2); }
.tab:focus-visible { outline: 2px solid var(--sail); outline-offset: 2px; }
.tab[aria-current="true"] { background: var(--signal); border-color: var(--signal); }
.tab[aria-current="true"] small { color: var(--sail); }

.thumb {
  all: unset; cursor: pointer; flex: none; box-sizing: border-box;
  width: 112px; border-radius: 8px; overflow: hidden;
  background: var(--night-2); border: 2px solid transparent;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
  transition: transform .15s ease, border-color .15s ease;
}
.thumb img { display: block; width: 100%; height: 56px; object-fit: cover; }
.thumb { position: relative; }
.thumb[aria-current="true"]::after { content: ""; position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--signal) var(--boat-w) center / 15px no-repeat; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.thumb span { display: block; padding: 5px 7px 6px; font: 600 11.5px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb:hover { transform: translateY(-2px); }
.thumb:focus-visible { border-color: var(--sail); }
.thumb[aria-current="true"] { border-color: var(--signal); }

.map {
  position: fixed; z-index: 6;
  left: max(16px, env(safe-area-inset-left, 0px));
  top: calc(196px + env(safe-area-inset-top, 0px));
  width: 300px; max-height: calc(100% - 368px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: 160px;
  background: rgba(12, 26, 38, 0.28); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  padding: 10px 12px 12px; box-sizing: border-box;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
}
.map-head { display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; }
.map-head::after { content: ""; margin-left: auto; flex: none; width: 46px; height: 18px; background: var(--boat-w) 12px 0 / 16px 16px no-repeat, url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2046%206%22%3E%3Cpath%20d%3D%22M0%203q5.75-4%2011.5%200t11.5%200%2011.5%200%2011.5%200%22%20fill%3D%22none%22%20stroke%3D%22%237fb8e6%22%20stroke-width%3D%221.6%22/%3E%3C/svg%3E") 0 13px / 46px 5px repeat-x; opacity: .8; animation: mapBoat 3s ease-in-out infinite; }
@keyframes mapBoat { 50% { background-position: 18px -1px, -6px 13px; } }
.map-back {
  all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px 5px 6px; border-radius: 999px; background: var(--signal); color: #fff;
  font: 800 11.5px/1 var(--body); letter-spacing: .02em;
}
.map-back svg { width: 14px; height: 14px; display: block; }

<script>
/* Zephyr Apartmanház – online foglalási felület (vendég oldal)
   Használat: ZephyrBooking.open({ apt: "korvett" })
   API: window.ZEPHYR_API (pl. "https://balatoni-udules.hu/wp-json/zephyr/v1"); ha nem érhető el, bemutató módban fut. */
(function () {
  "use strict";
  if (window.ZephyrBooking) return;
  const HU_M = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];
  const HU_WD = ["H", "K", "Sze", "Cs", "P", "Szo", "V"];
  const money = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft";
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const pd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const huDate = (s, wd) => { const d = pd(s); return d.getFullYear() + ". " + HU_M[d.getMonth()] + " " + d.getDate() + "." + (wd ? " (" + ["vasárnap", "hétfő", "kedd", "szerda", "csütörtök", "péntek", "szombat"][d.getDay()] + ")" : ""); };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  /* A foglalási program a séta mappájában: api/index.php (a weboldalra feltöltve). A claude.ai előnézetben bemutató mód. */
  function apiBase() {

    const all = A.data.bookings, t = A.data.today;
    const sec = (title, arr, hint) => `<section class="zad-sec"><h3>${title} <em>${arr.length}</em></h3>${hint ? `<p class="zfb-fine" style="margin:-6px 0 10px">${hint}</p>` : ""}${arr.length ? `<div class="zad-cards">${arr.map((b) => card(b)).join("")}</div>` : `<p class="zad-empty">Nincs ilyen.</p>`}</section>`;
    const pend = all.filter((b) => b.status === "pending");
    const appr = all.filter((b) => b.status === "approved");
    const paid = all.filter((b) => b.status === "paid" && b.checkout >= t);
    const blk = all.filter((b) => b.status === "block" && b.checkout >= t && !isExt(b));
    const ext = (src) => all.filter((b) => isExt(b) && b.source === src && b.checkout >= t);
    const closed = all.filter((b) => ["rejected", "cancelled", "expired"].includes(b.status) || (["paid", "block"].includes(b.status) && b.checkout < t && !isExt(b))).sort((a, b) => (b.created || 0) - (a.created || 0));
    let h = sec("Jóváhagyásra vár", pend, pend.length ? `Ha ${A.data.settings.pending_days} napon belül nem döntesz, a kérés lejár és a napok felszabadulnak.` : "");
    h += sec("Jóváhagyva – előlegre vár", appr);
    h += sec("Végleges foglalások", paid);
    h += sec("Szállás.hu foglalások", ext("szallas"), "Ehhez a naptárhoz igazodik minden: a Szállás.hu-ról jött napok itt és az Airbnb-n is lezárva. Itt nem módosíthatók.");
    h += sec("Airbnb foglalások", ext("airbnb"));
    if (ext("egyeb").length) h += sec("Egyéb naptárból", ext("egyeb"));
    h += sec("Kézi zárolások", blk);
    h += `<section class="zad-sec"><button type="button" class="zad-link" data-closed="1">${A.showClosed ? "▾" : "▸"} Lezárt, elutasított, lejárt (${closed.length})</button>${A.showClosed ? `<div class="zad-cards">${closed.map((b) => card(b, true)).join("") || `<p class="zad-empty">Nincs ilyen.</p>`}</div>` : ""}</section>`;
    return h;
  }

  function calView() {
    const S = A.data.settings, t = A.data.today, m = A.month;
    const first = m + "-01", dim = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
    const inSeason = (d) => { const f = S.season_from, to = S.season_to; if (!f || !to) return true; const md = d.slice(5); return f <= to ? md >= f && md <= to : md >= f || md <= to; };
    const blocking = ["pending", "approved", "paid", "block"];
    let h = `<div class="zad-calnav"><button type="button" class="zad-b" data-month="-1">‹ Előző</button><b>${m.slice(0, 4)}. ${HU_MC[+m.slice(5) - 1]}</b><button type="button" class="zad-b" data-month="1">Következő ›</button><button type="button" class="zad-link" data-month="0">Ma</button></div>`;
    h += `<div class="zad-calwrap"><table class="zad-cal"><thead><tr><th class="ap"></th>`;
    for (let i = 0; i < dim; i++) { const d = addD(first, i), w = pd(d).getDay(); h += `<th class="${w === 5 || w === 6 ? "we" : ""}${d === t ? " td" : ""}">${i + 1}<small>${WD[w]}</small></th>`; }
    h += `</tr></thead><tbody>`;
    S.apartments.forEach((a) => {
      h += `<tr><th class="ap" style="--ac:${a.color}"><span class="zfb-no">${a.no}</span>${esc(a.name)}</th>`;
      const bs = A.data.bookings.filter((b) => b.apt === a.id && blocking.includes(b.status) && b.checkin < addD(first, dim) && b.checkout > first);
      for (let i = 0; i < dim; i++) {
        const d = addD(first, i), b = bs.find((x) => x.checkin <= d && x.checkout > d);
        if (b) h += `<td class="bk st-${b.status}${isExt(b) ? " src-" + b.source : ""}${b.conflict ? " conf" : ""}${d === b.checkin ? " ci" : ""}${A.calSel === b.id ? " sel" : ""}"><button type="button" data-cal="${b.id}" title="${esc((b.status === "block" ? b.label : b.name) + " · " + ST[b.status])}"></button></td>`;
        else h += `<td class="${!inSeason(d) || d < t ? "off" : ""}${d === t ? " td" : ""}"></td>`;
      }
      h += `</tr>`;
    });
    h += `</tbody></table></div><p class="zad-legend"><span class="st-pending"></span>Jóváhagyásra vár <span class="st-approved"></span>Előlegre vár <span class="st-paid"></span>Végleges <span class="st-block src-szallas"></span>Szállás.hu <span class="st-block src-airbnb"></span>Airbnb <span class="st-block"></span>Zárolva <span class="off"></span>Szezonon kívül / elmúlt</p>`;
    const sel = A.calSel && A.data.bookings.find((b) => b.id === A.calSel);
    h += sel ? `<div class="zad-cards">${card(sel)}</div>` : `<p class="zfb-fine">Koppints egy színes napra a foglalás részleteiért.</p>`;
    return h;
  }

      <div class="zad-c-hd"><b>${esc(e.title)}</b><span class="zad-st st-approved">${EVC[e.cat] || "Egyéb"}</span></div>
      <div class="zad-c-dates"><b>${hu(e.from)}${e.to ? " – " + hu(e.to) : ""}</b>${e.time ? ` <span>${esc(e.time)}</span>` : ""}</div>
      ${e.place ? `<div class="zad-c-who">${esc(e.place)}</div>` : ""}${e.desc ? `<p class="zad-note">${esc(e.desc)}</p>` : ""}
      <div class="zad-c-who"><small>${e.url ? "🔗 Bővebben link · " : ""}${e.ticket ? "🎫 Jegy link · " : ""}${e.top ? "★ Kiemelt · " : ""}${e.hidden ? "Rejtve" : "Látható"}</small></div>
      <div class="zad-acts"><button type="button" class="zad-b" data-evedit="${e.id}">Szerkesztés</button><button type="button" class="zad-b" data-evdup="${e.id}">Másolat</button><button type="button" class="zad-b del" data-evdel="${e.id}">Törlés</button></div></article>`;
    h += `<section class="zad-sec"><h3>Közelgő programok <em>${up.length}</em></h3>${up.length ? `<div class="zad-cards">${up.map(row).join("")}</div>` : `<p class="zad-empty">Még nincs felvéve program. Az „+ Új program” gombbal adhatsz hozzá.</p>`}</section>`;
    if (past.length) h += `<section class="zad-sec"><button type="button" class="zad-link" data-evpast="1">${A.evPast ? "▾" : "▸"} Elmúlt programok (${past.length})</button>${A.evPast ? `<div class="zad-cards">${past.map(row).join("")}</div>` : ""}</section>`;
    return h;
  }
  async function saveEv(list, msg) {
    A.busy = true; render();
    try { const r = await call("events_save", { events: list }); A.ev = r.events; A.evEdit = null; A.busy = false; flash(msg || r.message); try { window.dispatchEvent(new Event("zephyr-events-changed")); } catch (z) {} }
    catch (x) { A.busy = false; A.err = x.message; render(); }
  }

  function dlgView() {
    const d = A.dlg;
    const b = A.data.bookings.find((x) => x.id === d.id) || {};
    if (d.act === "delext") {
      const src = SRCN[b.source] || "külső";
      return `<div class="zad-dlg"><form class="zad-dlg-in warn" data-form="dlg"><h3>⚠ ${src} foglalás törlése</h3>
      <p><b>${esc(b.label || src)}</b> · ${hu(b.checkin)} – ${hu(b.checkout)}</p>
      <div class="zad-bigwarn"><b>Figyelem!</b> Ez a foglalás a(z) ${src} oldalán létezik. Ha itt törlöd, a napok a sétában és a többi platformon (${b.source === "szallas" ? "Airbnb" : "Szállás.hu"}) is szabaddá válnak – <b>dupla foglalás</b> lehet belőle. A vendég foglalását ez <b>nem</b> mondja le a(z) ${src}-n.<br>Csak akkor töröld, ha a(z) ${src}-n már biztosan nincs meg (pl. lemondták, de a szinkron még nem frissült).</div>
      <label class="zad-chk"><input type="checkbox" name="confirm" required> Megértettem, mégis törlöm</label>
      <label class="zad-chk"><input type="checkbox" name="ignore"> A szinkron se hozza vissza (ha a platformon még szerepel)</label>
      <div class="zad-acts"><button type="submit" class="zad-b del">Törlés</button><button type="button" class="zad-b" data-dlgclose="1">Mégse</button></div></form></div>`;
    }
    const t = { reject: "Kérés elutasítása", cancel: "Foglalás törlése", note: "Saját megjegyzés", delete: "Végleges törlés", approve: "Jóváhagyás", paid: "Előleg megérkezett" }[d.act] || "";
    const txt = {
      approve: `A vendég e-mailt kap az előleg (${money(b.deposit)}) utalásához szükséges adatokkal.`,
      paid: "A foglalás véglegessé válik, a vendég visszaigazoló e-mailt kap.",
      delete: "A foglalás minden adata véglegesen törlődik. Ez nem vonható vissza.",
      cancel: "A napok felszabadulnak, és újra foglalhatók lesznek.",
      reject: "A napok felszabadulnak.",
    }[d.act] || "";
    const needsReason = ["reject", "cancel"].includes(d.act);
    return `<div class="zad-dlg"><form class="zad-dlg-in" data-form="dlg"><h3>${t}</h3>
      <p><b>${esc(b.name || b.label || "")}</b> · ${hu(b.checkin)} – ${hu(b.checkout)}</p>${txt ? `<p class="zfb-fine">${txt}</p>` : ""}
      ${needsReason ? `<label class="zad-f"><span>Üzenet a vendégnek (nem kötelező)</span><textarea name="reason" rows="3"></textarea></label>${b.email ? `<label class="zad-chk"><input type="checkbox" name="notify" ${d.act === "reject" ? "checked" : ""}> E-mail a vendégnek</label>` : ""}` : ""}
      ${d.act === "note" ? `<label class="zad-f"><span>Csak te látod</span><textarea name="reason" rows="4">${esc(b.admin_note || "")}</textarea></label>` : ""}
      <div class="zad-acts"><button type="submit" class="zad-b ${d.act === "delete" ? "del" : "pri"}">${d.act === "note" ? "Mentés" : "Rendben"}</button><button type="button" class="zad-b" data-dlgclose="1">Mégse</button></div></form></div>`;
  }

  /* ---------- események ---------- */
  function flash(m) { A.msg = m; A.err = ""; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { A.msg = ""; if (el && !el.hidden) render(); }, 5000); }
  function grabSettings() {
    const S = A.settings;
    el.querySelectorAll("[data-s]").forEach((i) => { S[i.dataset.s] = i.type === "checkbox" ? (i.checked ? 1 : 0) : i.value; });
    el.querySelectorAll("[data-ap]").forEach((i) => { const a = S.apartments[+i.dataset.ap]; a[i.dataset.k] = i.type === "checkbox" ? (i.checked ? 1 : 0) : i.value; });
    el.querySelectorAll("[data-ru]").forEach((i) => { const r = S.price_rules[+i.dataset.ru]; if (r) r[i.dataset.k] = i.value; });
    el.querySelectorAll("[data-se]").forEach((i) => { const x = (S.seasons || [])[+i.dataset.se]; if (x) x[i.dataset.k] = i.value.trim(); });
    el.querySelectorAll("[data-sp]").forEach((i) => { const x = (S.seasons || [])[+i.dataset.sp]; if (x) (x.prices = x.prices || {})[i.dataset.apt] = +i.value || 0; });
    if (el.querySelector("[data-ical]")) { S.ical = {}; el.querySelectorAll("[data-ical]").forEach((i) => { if (i.value.trim()) (S.ical[i.dataset.ical] = S.ical[i.dataset.ical] || {})[i.dataset.src] = i.value.trim(); }); }
  }
  async function onClick(e) {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.tab) { if (A.tab === "settings") grabSettings(); A.tab = b.dataset.tab; A.err = ""; A.msg = ""; render(); el.querySelector(".zad-body").scrollTop = 0; if (A.tab === "prog" && !A.ev) loadEv(); return; }
    if (b.dataset.reload) { if (A.tab === "prog") { A.ev = null; render(); return loadEv(); } return load(); }
    if (b.dataset.evnew) { A.evEdit = { cat: "egyeb" }; render(); el.querySelector(".zad-body").scrollTop = 0; return; }
    if (b.dataset.evcancel) { A.evEdit = null; return render(); }
    if (b.dataset.evpast) { A.evPast = !A.evPast; return render(); }
    if (b.dataset.evedit) { A.evEdit = Object.assign({}, A.ev.find((e) => e.id === b.dataset.evedit)); render(); el.querySelector(".zad-body").scrollTop = 0; return; }
    if (b.dataset.evdup) { const e = Object.assign({}, A.ev.find((x) => x.id === b.dataset.evdup)); delete e.id; e.title += " (másolat)"; A.evEdit = e; render(); el.querySelector(".zad-body").scrollTop = 0; return; }
    if (b.dataset.evdel) { const e = A.ev.find((x) => x.id === b.dataset.evdel); if (e && window.confirm("Biztosan törlöd ezt a programot?\n\n" + e.title)) return saveEv(A.ev.filter((x) => x.id !== e.id), "Program törölve."); return; }
    if (b.dataset.closed) { A.showClosed = !A.showClosed; return render(); }
    if (b.dataset.month) { const n = +b.dataset.month; if (!n) A.month = A.data.today.slice(0, 7); else { const d = pd(A.month + "-01"); d.setMonth(d.getMonth() + n); A.month = ymd(d).slice(0, 7); } A.calSel = null; return render(); }
    if (b.dataset.cal) { A.calSel = A.calSel === b.dataset.cal ? null : b.dataset.cal; return render(); }
    if (b.dataset.act) { A.dlg = { act: b.dataset.act, id: b.dataset.id }; if (b.dataset.act === "resend") return doAction("resend", b.dataset.id, {}); return render(); }
    if (b.dataset.dlgclose) { A.dlg = null; return render(); }
    if (b.dataset.addrule) { grabSettings(); (A.settings.price_rules = A.settings.price_rules || []).push({ from: "", to: "", apt: "all", price: "" }); return render(); }
    if (b.dataset.delrule) { grabSettings(); A.settings.price_rules.splice(+b.dataset.delrule, 1); return render(); }
    if (b.dataset.logout) { try { await call("logout", {}); } catch (x) {} setTok(""); A.data = null; return render(); }
    if (b.dataset.copy != null) { try { navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Másolva ✓"; setTimeout(() => (b.textContent = "Másolás"), 1600); } catch (x) {} return; }
    if (b.dataset.sync) { grabSettings(); A.busy = true; render(); try { await call("save_settings", { settings: A.settings }); const r = await call("sync", {}); A.settings = null; await load(true); flash(r.message); } catch (x) { A.busy = false; A.err = x.message; render(); } return; }
    if (b.dataset.testmail) { A.busy = true; render(); try { const r = await call("test_mail", {}); A.busy = false; r.ok ? flash(r.message) : (A.err = r.message, render()); } catch (x) { A.busy = false; A.err = x.message; render(); } return; }
  }
  async function doAction(act, id, extra) {
    A.busy = true; render();
    try { const r = await call("action", Object.assign({ do: act, id }, extra)); A.dlg = null; await load(true); flash(r.message); }
    catch (x) { A.busy = false; A.dlg = null; A.err = x.message; render(); }
  }
  async function onSubmit(e) {
    e.preventDefault();
    const f = e.target, kind = f.dataset.form, fd = Object.fromEntries(new FormData(f).entries());
    if (kind === "login") {
      A.busy = true; A.err = ""; render();

      catch (x) { A.busy = false; A.err = x.message; render(); }
      return;
    }
    if (kind === "ev") {
      const E = Object.assign({}, A.evEdit, fd, { top: !!fd.top, hidden: !!fd.hidden });
      if (!E.title || !E.from) { A.err = "A program neve és az első nap kötelező."; return render(); }
      if (E.to && E.to < E.from) { A.err = "Az utolsó nap nem lehet az első nap előtt."; return render(); }
      const list = A.ev.slice(); const i = E.id ? list.findIndex((x) => x.id === E.id) : -1;
      if (i >= 0) list[i] = E; else list.push(E);
      return saveEv(list, i >= 0 ? "Program módosítva." : "Program felvéve.");
    }
    if (kind === "dlg") {
      const d = A.dlg;
      if (d.act === "delext") { if (!fd.confirm) { A.err = "A törléshez jelöld be: „Megértettem, mégis törlöm”."; return render(); } return doAction("delete", d.id, { confirm: 1, ignore: fd.ignore ? 1 : 0 }); }
      return doAction(d.act, d.id, { reason: fd.reason || "", notify: !!fd.notify });
    }
    if (kind === "manual") {
      if (!fd.checkin || !fd.checkout || fd.checkout <= fd.checkin) { A.err = "A távozás napja legyen az érkezés után."; return render(); }
      A.busy = true; render();
      try { const r = await call("manual", fd); f.reset(); await load(true); A.tab = "list"; flash(r.message); }
      catch (x) { A.busy = false; A.err = x.message; render(); }
      return;
    }
    if (kind === "settings") {
      grabSettings(); A.busy = true; render();
      try { const r = await call("save_settings", { settings: A.settings }); A.settings = JSON.parse(JSON.stringify(r.settings)); await load(true); if (window.ZephyrBooking && ZephyrBooking.reset) ZephyrBooking.reset(); flash(r.message); }
      catch (x) { A.busy = false; A.err = x.message; render(); }
      return;
    }
    if (kind === "password") {
      A.busy = true; render();
      try { const r = await call("password", { old: fd.old, new: fd.new }); A.initial = false; await load(true); flash(r.message); }
      catch (x) { A.busy = false; A.err = x.message; render(); }
    }
  }

  window.ZephyrAdmin = { open, close };
  if (location.hash === "#foglalas-admin") setTimeout(open, 600);
  window.addEventListener("hashchange", () => { if (location.hash === "#foglalas-admin") open(); });
})();

  function spreadLinks(links) {
    const out = new Map(links.map((l) => [l, l[1]]));
    if (device === "pc" || EDIT || links.length < 2) return out;
    const items = links.map((l) => ({ l, x: l[1], y: l[2] })).sort((a, b) => a.x - b.x);
    for (let pass = 0; pass < 6; pass++) {
      let moved = false;
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        if (Math.abs(a.y - b.y) > 0.16) continue;
        const ring = 2 * Math.PI * SPOT_R * Math.max(0.35, Math.sin(Math.PI * (a.y + b.y) / 2));
        const need = (1.0 * spotScale + 0.3) / ring;
        const gap = b.x - a.x;
        if (gap >= 0 && gap < need) { const d = (need - gap) / 2 + 0.001; a.x -= d; b.x += d; moved = true; }
      }
      if (!moved) break;
    }
    items.forEach((it) => out.set(it.l, (it.x % 1 + 1) % 1));
    return out;
  }

  function wireEdit3D() {

    canvas.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved > 6 || !editSel) return;
      const cx = e.clientX, cy = e.clientY;
      setTimeout(() => {
        if (performance.now() - lastSpotClick < 120) return;
        const r = canvas.getBoundingClientRect();
        const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
        const rc = new THREE.Raycaster();
        rc.setFromCamera(ndc, sceneEl.camera);
        const d = rc.ray.direction;
        const x = ((Math.atan2(d.z, d.x) / (2 * Math.PI)) + 1) % 1;
        const y = Math.acos(Math.max(-1, Math.min(1, d.y))) / Math.PI;
        placeSelected3D(x, y);
      }, 30);
    });
  }

  /* ---------------- 3. Mentőöv-célbadobás ---------------- */

  /* ---------------- 4. Vitorlás-regatta a Balatonon, a stégről nézve ---------------- */
  function gameRace() {

      { n: "Kék Fecske", sail: "#ffffff", sail2: "#cfd8e2", hull: "#ffffff", num: "HUN 7", band: "#1f5fa8" },
      { n: "Sárga Szél", sail: "#fff3c4", sail2: "#e8d48a", hull: "#ffffff", num: "HUN 21", band: "#f2b233" },
      { n: "Tihanyi Csillag", sail: "#ffffff", sail2: "#d5dde5", hull: "#e9eef2", num: "HUN 3", band: "#2e7d32" }

    function course() {
      const z1 = 74, a = Math.min(30, viewHalf(C, z1) * .62), lz = 27, lh = Math.min(12, viewHalf(C, lz) * .8);

    }
    function reset() {
      CO = course(); S.t = 0; S.res = []; S.foam = []; S.spray = []; S.st = "count"; S.cd = 3.6; S.wind = gmRnd(.15, .45) * (Math.random() < .5 ? -1 : 1);
      const n = C.W < 600 ? 3 : 4;
      S.boats = CREW.slice(0, n).map((c, i) => { const fr = n === 1 ? 0 : i / (n - 1) - .5; return { c, X: fr * CO.lh * 1.7, Z: CO.lz - 4 - (i % 2) * 2.5, hd: S.wind - Math.sign(S.wind || 1) * .9, v: 0, heel: 0, boom: 0, next: 0, done: false, ft: 0, tack: 0, sk: c.me ? 1 : gmRnd(.84, .95), ftm: 0 }; });
      S.msg = ""; S.blast = 0;
    }
    const horn = (l) => { fxTone(233, 228, l || .7, .045, "sawtooth"); fxTone(466, 460, l || .7, .02, "triangle"); };
    function sail(b, dt) {

      b.v += (tv - b.v) * dt * (tv < b.v ? 1.1 : .55);

      b.boom += (side * gmClamp(th * .55, .12, 1.25) - b.boom) * dt * 3;
      b.X += Math.sin(b.hd) * b.v * dt; b.Z += Math.cos(b.hd) * b.v * dt;
      b.Z = gmClamp(b.Z, 9, 95); const hv = viewHalf(C, b.Z) * 1.08; b.X = gmClamp(b.X, -hv, hv);
      b.ftm += dt; if (b.ftm > .07 && b.v > .6) { b.ftm = 0; S.foam.push({ X: b.X - Math.sin(b.hd) * 3.9 * K, Z: b.Z - Math.cos(b.hd) * 3.9 * K, a: .8, w: .3 }); if (b.v > 4.6 && Math.random() < .5) for (let k = 0; k < 3; k++) S.spray.push({ X: b.X + Math.sin(b.hd) * 4 * K, Y: .2, Z: b.Z + Math.cos(b.hd) * 4 * K, vx: gmRnd(-1, 1), vy: gmRnd(1, 2.2), vz: gmRnd(-.5, .5), a: 1 }); }
      if (!b.done) {
        if (b.next < 2) { const m = CO.m[b.next]; if (Math.hypot(b.X - m[0], b.Z - m[1]) < 7) { b.next++; if (b.c.me) { gmSnd.coin(); S.msg = b.next === 1 ? "1. bója megvan – irány a 2.!" : "2. bója megvan – vissza a célvonalhoz a stég elé!"; } } }
        else if (b.Z < CO.lz && Math.abs(b.X) < CO.lh + 2) { b.done = true; b.ft = S.t; S.res.push(b); if (b.c.me) { const pos = S.res.length; S.msg = pos === 1 ? "GYŐZTÉL! Első lettél!" : `Célba értél – ${pos}. hely.`; gmSnd.win(); S.best = S.best == null ? S.t : Math.min(S.best, S.t); } else fxTone(880, 880, .2, .02, "sine"); }

    /* vitorlás rajzolása valódi 3D pontokból: hajótest, fedélzet, árboc, nagyvitorla, orrvitorla, legénység */
    function boat3d(g, b, t) {

        g.fillStyle = b.c.hull; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b2.x, b2.y); g.lineTo(c.x, c.y); g.lineTo(d.x, d.y); g.closePath(); g.fill();

    const dpr = Math.min(2, window.devicePixelRatio || 1), W = gmCv.clientWidth, H = gmCv.clientHeight;
    if (gmCv.width !== Math.round(W * dpr) || gmCv.height !== Math.round(H * dpr)) { gmCv.width = Math.round(W * dpr); gmCv.height = Math.round(H * dpr); }
    const dt = Math.min(.05, (now - gmLast) / 1000); gmLast = now;
    /* játékidő: csak ha az oldal látszik, és az utolsó 20 mp-ben volt mozdulat */
    if (!document.hidden && now - gmInput < 20000 && !(window.ZephyrGame && window.ZephyrGame.discount())) {
      gmMs += dt * 1000; if (Math.floor(gmMs / 1000) !== Math.floor((gmMs - dt * 1000) / 1000)) { gmSave(gmMs); gmHud(); }
      if (gmMs >= GM_GOAL) { gmSave(gmMs); gmReward(); gmHud(); }
    }
    gmG.setTransform(dpr, 0, 0, dpr, 0, 0); gmG.clearRect(0, 0, W, H);
    try { gmGame.step(dt, now); gmGame.draw(gmG, W, H, now / 1000); } catch (e) { console.warn(e); }
    gmRaf = requestAnimationFrame(gmFrame);
  }
  function gmClose() { if (!gmEl) return; gmSave(gmMs); gmEl.classList.remove("on"); cancelAnimationFrame(gmRaf); setTimeout(() => { if (gmEl) gmEl.hidden = true; }, 280); }
  /* a stégen megjelenő játékválasztó (dokk) – benne a nyerőautomata kiemelve */
  function stegDock(on) {
    if (!gmDock) {
      gmDock = document.createElement("div"); gmDock.className = "gm-dock"; gmDock.hidden = true;
      gmDock.innerHTML = `<button type="button" class="gm-slotcard" data-gm="slot" aria-label="Zephyr nyerőautomata"><canvas width="220" height="260"></canvas><span><b>Nyerőautomata</b><small>és stégjátékok</small></span></button>
        <div class="gm-list"><h4>Stégjátékok <em>5 perc = 5%</em></h4>${GM_LIST.slice(1).map((q) => `<button type="button" data-gm="${q.id}" style="--gc:${q.c}"><b>${q.n}</b><small>${q.d}</small></button>`).join("")}</div>`;
      document.body.appendChild(gmDock);
      gmDock.addEventListener("click", (e) => { const b = e.target.closest("[data-gm]"); if (b) gmOpen(b.dataset.gm); });
      const c = gmDock.querySelector("canvas"), g = c.getContext("2d"); let t0 = performance.now();
      (function mini(now) { if (!gmDock.hidden) { g.clearRect(0, 0, 220, 260); const s = slotMini(g, (now - t0) / 1000); } requestAnimationFrame(mini); })(t0);
    }
    gmDock.hidden = !on || EDIT;
  }
  function slotMini(g, t) {   /* kis, élő nyerőautomata-ikon a dokkban */
    const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
    const body = g.createLinearGradient(30, 0, 190, 0); body.addColorStop(0, "#7a0f0a"); body.addColorStop(.5, "#ff5243"); body.addColorStop(1, "#7a0f0a");
    rr(34, 60, 150, 190, 18); g.fillStyle = body; g.fill(); g.strokeStyle = "#f2d27a"; g.lineWidth = 3; g.stroke();
    rr(40, 20, 138, 50, 22); g.fillStyle = "#0b2f5e"; g.fill(); g.strokeStyle = "#f2d27a"; g.stroke();
    for (let i = 0; i < 10; i++) { g.fillStyle = (Math.floor(t * 8) + i) % 3 ? "#7a6420" : "#fff3a8"; g.beginPath(); g.arc(50 + i * 13, 27, 3, 0, 7); g.fill(); g.beginPath(); g.arc(50 + i * 13, 63, 3, 0, 7); g.fill(); }
    g.fillStyle = "#f2d27a"; g.font = "900 17px Georgia, serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("JACKPOT", 109, 45);
    rr(48, 92, 122, 64, 8); g.fillStyle = "#fffdf6"; g.fill();
    ["zeta", "seven", "boat"].forEach((k, i) => slotIcon(g, SLOT_SYM[(Math.floor(t * 1.2) + i * 2) % SLOT_SYM.length] === "zeta" ? "zeta" : k, 68 + i * 41, 124 + Math.sin(t * 6 + i) * 3, 15));
    g.strokeStyle = "#cfd6de"; g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(184, 150); g.lineTo(200, 96 + Math.max(0, Math.sin(t * 1.5)) * 30); g.stroke();
    g.fillStyle = "#e2261e"; g.beginPath(); g.arc(200, 96 + Math.max(0, Math.sin(t * 1.5)) * 30, 9, 0, 7); g.fill();
    rr(70, 172, 78, 26, 13); g.fillStyle = "#f2b233"; g.fill(); g.fillStyle = "#3a2600"; g.font = "900 13px Manrope, Arial"; g.fillText("SPIN", 109, 186);
  }

  async function start() {
    applyDevice();
    wireDevice();
    wireGyro();
    wireTouchPitch();
    buildTabs();
    wireTools();
    wireCube();
    const hash = decodeURIComponent((location.hash || "").slice(1));
    const firstId = isVisible(hash) ? hash : "utca";
    if (EDIT) renderEdit();
    let ok = true;
    try { await loadScript(0); } catch (e) { ok = false; }
    let gl = null;
    try { const c = document.createElement("canvas"); gl = c.getContext("webgl2") || c.getContext("webgl"); } catch (e) {}
    if (!ok || !gl || !window.AFRAME) { switchToFlat(firstId); return; }
    try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]); } catch (e) {}
    try {
      await Promise.race([buildScene(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))]);
      await go(firstId, true);
      wireEdit3D();
      try { initCube3D(); } catch (e) {}
    } catch (e) { switchToFlat(firstId); return; }
    $("loader").classList.add("done");
    tick();
  }
  start();
})();
</script>
